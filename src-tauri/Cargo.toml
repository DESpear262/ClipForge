[package]
name = "clipforge"
version = "0.1.0-mvp"
description = "ClipForge - Lightweight Desktop Video Editor"
authors = ["ClipForge Development Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "1", features = [ "protocol-asset", "dialog-open", "dialog-save", "devtools", "fs-read-file", "shell-open" ] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
# Enable Tauri's custom protocol handler required for embedded assets (tauri://localhost)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
